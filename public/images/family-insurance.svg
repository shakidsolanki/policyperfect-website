<!-- ═══════════════════════════════════════════════════════════ -->
<!--   ICON BADGES — smooth arc ABOVE umbrella canopy           -->
<!--   Arc follows umbrella curve at ~r=240 from center (260,255)-->
<!-- ═══════════════════════════════════════════════════════════ -->

<!-- Arc connector line (very subtle, optional visual guide) -->
<path d="M 52 198 Q 150 52 260 28 Q 370 52 468 198"
      fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,7" opacity="0.6"/>

<!-- ① CAR — top-left  (arc position: ~155°) -->
<g transform="translate(115,62)" filter="url(#bubble-shadow)">
  <circle r="32" fill="#ffffff" stroke="#e8edf4" stroke-width="1.5"/>
  <!-- Car body -->
  <rect x="-16" y="-1" width="32" height="13" rx="4" fill="#0c1b33"/>
  <!-- Cabin -->
  <path d="M -10 -1 L -7 -13 L 7 -13 L 10 -1 Z" fill="#0c1b33"/>
  <!-- Windshield -->
  <rect x="-6" y="-11" width="12" height="7" rx="1.5" fill="#93c5fd" opacity="0.9"/>
  <!-- Wheels -->
  <circle cx="-9" cy="13" r="6" fill="#334155" stroke="#dfb15b" stroke-width="2"/>
  <circle cx=" 9" cy="13" r="6" fill="#334155" stroke="#dfb15b" stroke-width="2"/>
  <circle cx="-9" cy="13" r="2.2" fill="#dfb15b"/>
  <circle cx=" 9" cy="13" r="2.2" fill="#dfb15b"/>
  <!-- Shield badge top-right -->
  <circle cx="20" cy="-20" r="9" fill="#dfb15b"/>
  <path d="M 20 -28 L 27 -24 L 27 -17 Q 27 -11 20 -8 Q 13 -11 13 -17 L 13 -24 Z" fill="#0c1b33"/>
  <path d="M 16 -18 L 19 -15 L 24 -22" fill="none" stroke="#dfb15b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- ② HEALTH (Heart + ECG) — center top  (arc apex) -->
<g transform="translate(260,28)" filter="url(#bubble-shadow)">
  <circle r="34" fill="#ffffff" stroke="#e8edf4" stroke-width="1.5"/>
  <!-- Heart shape -->
  <path d="M 0 9 Q -12 0 -12 -9 Q -12 -18 -5 -18 Q 0 -18 0 -13 Q 0 -18 5 -18 Q 12 -18 12 -9 Q 12 0 0 9 Z" fill="#e11d48"/>
  <!-- ECG pulse over heart -->
  <path d="M -16 3 L -10 3 L -7 -3 L -2 14 L 3 -6 L 7 3 L 16 3"
        fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shield badge top-right -->
  <circle cx="22" cy="-22" r="9" fill="#0c1b33"/>
  <path d="M 22 -30 L 29 -26 L 29 -19 Q 29 -13 22 -10 Q 15 -13 15 -19 L 15 -26 Z" fill="#dfb15b"/>
  <path d="M 18 -20 L 21 -17 L 26 -24" fill="none" stroke="#0c1b33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- ③ HOME — top-right  (arc position: ~25°) -->
<g transform="translate(405,62)" filter="url(#bubble-shadow)">
  <circle r="32" fill="#ffffff" stroke="#e8edf4" stroke-width="1.5"/>
  <!-- Roof -->
  <path d="M -14 5 L 0 -15 L 14 5 Z" fill="#0c1b33"/>
  <!-- Chimney -->
  <rect x="5" y="-18" width="5" height="8" rx="1" fill="#0c1b33"/>
  <!-- Smoke from chimney -->
  <path d="M 7 -18 Q 6 -22 8 -24 Q 10 -26 8 -28" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <!-- House body -->
  <rect x="-11" y="5" width="22" height="15" rx="2" fill="#0c1b33" opacity="0.92"/>
  <!-- Door -->
  <rect x="-3.5" y="10" width="7" height="10" rx="1.5" fill="#dfb15b"/>
  <!-- Windows -->
  <rect x="-10" y="7" width="6" height="6" rx="0.5" fill="#93c5fd" opacity="0.85"/>
  <rect x="4"   y="7" width="6" height="6" rx="0.5" fill="#93c5fd" opacity="0.85"/>
  <!-- Shield badge top-right -->
  <circle cx="20" cy="-20" r="9" fill="#dfb15b"/>
  <path d="M 20 -28 L 27 -24 L 27 -17 Q 27 -11 20 -8 Q 13 -11 13 -17 L 13 -24 Z" fill="#0c1b33"/>
  <path d="M 16 -18 L 19 -15 L 24 -22" fill="none" stroke="#dfb15b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- ④ AIRPLANE (Travel) — top far-right  (arc position: ~15°) -->
<g transform="translate(468,175)" filter="url(#bubble-shadow)">
  <circle r="30" fill="#ffffff" stroke="#e8edf4" stroke-width="1.5"/>
  <!-- Airplane fuselage -->
  <ellipse cx="0" cy="0" rx="15" ry="4.5" fill="#0c1b33" transform="rotate(-38)"/>
  <!-- Main wing -->
  <path d="M -1 -2 L -16  7 L -9  9 L 0 3 Z" fill="#0c1b33"/>
  <path d="M  1  2 L  16 -7 L  9 -9 L 0 -3 Z" fill="#0c1b33"/>
  <!-- Tail wing -->
  <path d="M -9 5 L -18 1 L -16 -2 L -9 1 Z" fill="#0c1b33"/>
  <!-- Exhaust trail dots -->
  <circle cx="14"  cy="-9"  r="2" fill="#dfb15b" opacity="0.8"/>
  <circle cx="18" cy="-12"  r="1.5" fill="#dfb15b" opacity="0.55"/>
  <circle cx="22" cy="-15"  r="1"   fill="#dfb15b" opacity="0.35"/>
  <!-- Shield badge top-left -->
  <circle cx="-20" cy="-20" r="9" fill="#0c1b33"/>
  <path d="M -20 -28 L -13 -24 L -13 -17 Q -13 -11 -20 -8 Q -27 -11 -27 -17 L -27 -24 Z" fill="#dfb15b"/>
  <path d="M -24 -18 L -21 -15 L -16 -22" fill="none" stroke="#0c1b33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- ⑤ MEDICAL CROSS — far-left  (arc position: ~165°) -->
<g transform="translate(52,175)" filter="url(#bubble-shadow)">
  <circle r="30" fill="#ffffff" stroke="#e8edf4" stroke-width="1.5"/>
  <!-- Cross -->
  <rect x="-6"  y="-16" width="12" height="32" rx="3" fill="#0c1b33"/>
  <rect x="-16" y="-6"  width="32" height="12" rx="3" fill="#0c1b33"/>
