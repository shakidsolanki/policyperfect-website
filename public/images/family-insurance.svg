<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 540 570" preserveAspectRatio="xMidYMid meet">
<defs>
  <filter id="bubble-shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity="0.18"/>
  </filter>
  <filter id="umbrella-shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#1e40af" flood-opacity="0.2"/>
  </filter>
</defs>

<!-- Pure white background -->
<rect x="-10" width="540" height="570" fill="#ffffff"/>

<!-- ── RAIN DROPS (only outside umbrella zone, very subtle) ── -->
<g opacity="0.3" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round">
  <line x1="8"  y1="180" x2="2"  y2="208"/>
  <line x1="28" y1="200" x2="22" y2="228"/>
  <line x1="6"  y1="230" x2="0"  y2="258"/>
  <line x1="24" y1="255" x2="18" y2="283"/>
  <line x1="490" y1="180" x2="484" y2="208"/>
  <line x1="508" y1="200" x2="502" y2="228"/>
  <line x1="488" y1="230" x2="482" y2="258"/>
  <line x1="506" y1="255" x2="500" y2="283"/>
</g>

<!-- ═══════════════ UMBRELLA ═══════════════ -->
<!-- Main canopy -->
<path d="M 78 255 C 78 148 152 76 260 73 C 368 76 442 148 442 255 Z"
      fill="#1e3a8a" filter="url(#umbrella-shadow)"/>
<!-- Sheen highlight on canopy -->
<path d="M 100 255 C 100 165 162 98 240 96 C 318 95 370 148 378 220"
      fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.12"/>
<!-- Segment lines (ribs) -->
<g stroke="white" stroke-width="1" opacity="0.15">
  <line x1="260" y1="255" x2="78"  y2="255"/>
  <line x1="260" y1="255" x2="442" y2="255"/>
  <line x1="260" y1="255" x2="108" y2="152"/>
  <line x1="260" y1="255" x2="412" y2="152"/>
  <line x1="260" y1="255" x2="178" y2="90"/>
  <line x1="260" y1="255" x2="342" y2="90"/>
  <line x1="260" y1="255" x2="260" y2="73"/>
</g>
<!-- Scalloped bottom edge -->
<path d="M 78 255 Q 91 241 104 255 Q 117 241 130 255 Q 143 241 156 255 Q 169 241 182 255 Q 195 241 208 255 Q 221 241 234 255 Q 247 241 260 255 Q 273 241 286 255 Q 299 241 312 255 Q 325 241 338 255 Q 351 241 364 255 Q 377 241 390 255 Q 403 241 416 255 Q 429 241 442 255"
      fill="#1e40af" stroke="#2563eb" stroke-width="1" stroke-linejoin="round"/>
<!-- Canopy border/outline -->
<path d="M 78 255 C 78 148 152 76 260 73 C 368 76 442 148 442 255"
      fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>

<!-- Pole -->
<line x1="260" y1="255" x2="260" y2="342" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
<path d="M 260 342 Q 260 364 246 369 Q 233 372 233 360" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

<!-- Shield badge at apex -->
<g transform="translate(247,57)">
  <path d="M 13 0 L 26 6 L 26 20 Q 26 33 13 40 Q 0 33 0 20 L 0 6 Z" fill="#1e3a8a"/>
  <!-- Checkmark shield (not cross) -->
  <path d="M 5 20 L 10 26 L 21 12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>


